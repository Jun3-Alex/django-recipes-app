version: "3.9"

services:
  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    env_file:
      - ../.env
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
    working_dir: /app/app
    volumes:
      - staticfiles:/app/app/staticfiles
      - media:/app/app/media
    depends_on:
      - db
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - private

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-postgres}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - private

volumes:
  postgres_data:
  staticfiles:
  media:

networks:
  private:
    internal: true